appId: ${APP_ID}
name: Clean photo.jpg with Remove everything shows Verified clean and Picture unchanged
tags:
  - p4
---
- runFlow: subflows/launch.yaml
- runFlow:
    file: subflows/keep-outputs.yaml
    env:
      VALUE: "on"
- runFlow:
    file: subflows/clean-one.yaml
    env:
      NAMES: photo.jpg
      PROFILE: all
- assertVisible: Verified clean
- assertVisible: Picture unchanged
- assertVisible: "Checked 4 ways: .* phone.s own reader \\((ImageIO|metadata-extractor)\\).*"
- scrollUntilVisible:
    element: Removed \(\d+\)
    timeout: 90000
- scrollUntilVisible:
    element: Kept \(\d+\) — why
    timeout: 90000
- scrollUntilVisible:
    element: .*Needed so it is shown the right way up.*
    timeout: 90000
- scrollUntilVisible:
    element: Your original file was not changed.*
    timeout: 90000
# leave the outputs on the device for scripts/pull-outputs.sh (Done does not delete them while "Keep outputs" is on)
- tapOn:
    id: done
- assertVisible:
    id: home-screen
- runFlow:
    file: subflows/keep-outputs.yaml
    env:
      VALUE: "off"
