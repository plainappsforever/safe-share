# DRAFT F-Droid recipe for com.tim.safeshare - generated by scripts/oss/fdroid_metadata.py from app.config.ts.
# Submit as metadata/com.tim.safeshare.yml in a fork of gitlab.com/fdroid/fdroiddata (after `fdroid lint` and
# `fdroid rewritemeta`, which also strips these comments). Based on fdroiddata templates/build-react-native.yml.
# No known blockers found by the audit (reviewers decide).
Categories:
  - Security
License: GPL-3.0-only
AuthorName: Plain Apps
AuthorEmail: plainapps@tuta.com
WebSite: https://plainapps.dfdsfdsfsdf.workers.dev/apps/safe-share/
SourceCode: https://github.com/plainappsforever/safe-share
IssueTracker: https://github.com/plainappsforever/safe-share/issues
Changelog: https://github.com/plainappsforever/safe-share/releases

AutoName: Safe Share

RepoType: git
Repo: https://github.com/plainappsforever/safe-share.git

Builds:
  - versionName: '1.0.0'
    versionCode: <versionCode>
    commit: <full commit hash of tag v1.0.0>
    subdir: android/app
    sudo:
      - apt-get update
      - apt-get install -y xz-utils
      # Debian trixie ships Node 20.19.2; React Native 0.86 requires >= 20.19.4. Official Node build, checksum-pinned
      # (the policy allows "current Node.js"). Re-check the sha256 against nodejs.org/dist/v22.23.3/SHASUMS256.txt.
      - curl -Lo /tmp/node.tar.xz https://nodejs.org/dist/v22.23.3/node-v22.23.3-linux-x64.tar.xz
      - echo "df450af89261115ef9f9e3830c3eeb2cc9213b63c720b1af623cb5dcbe2e02de  /tmp/node.tar.xz" | sha256sum -c -
      - tar xJf /tmp/node.tar.xz -C /opt
      - cp -a /opt/node-v22.23.3-linux-x64/. /usr/local/
    init:
      - cd ../..
      - npm ci
    gradle:
      - yes
    prebuild:
      - cd ../..
      # production variant (app id com.tim.safeshare); the build reads app.config.ts again when it bundles the JavaScript
      - sed -i -e "s/process.env.APP_VARIANT ?? 'development'/process.env.APP_VARIANT ?? 'production'/" app.config.ts
      # Expo modules compile from source instead of prebuilt AARs
      - sed -i -e '1a "expo":{"autolinking":{"android":{"buildFromSource":[".*"]}}},' package.json
      # F-Droid's buildserver (Debian trixie) uses JDK 21
      - sed -i '/jvmToolchain\|JavaVersion/s/17/21/' node_modules/@react-native/gradle-plugin/*/build.gradle.kts
      - npx expo prebuild -p android --clean
      - sed -i -e '/signingConfig /d' android/app/build.gradle
      - printf '\nandroid { dependenciesInfo { includeInApk = false; includeInBundle = false } }\n' >> android/app/build.gradle
    scanignore:
      - node_modules/react-native/sdks/hermesc/linux64-bin/hermesc
      - node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle
      - node_modules/expo-modules-autolinking/scripts/android/autolinking_implementation.gradle
    scandelete:
      - node_modules
    ndk: 27.1.12297006

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9.]+$
CurrentVersion: '1.0.0'
CurrentVersionCode: <versionCode>
